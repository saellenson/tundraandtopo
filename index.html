<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shira — Cartography &amp; GIS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand">Shira</div>
    <div class="nav-links">
      <a href="index.html" class="active">Work</a>
      <a href="about.html">About</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="grid" id="grid"></div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="lightbox-close">&times;</span>
  <div id="lightbox-media"></div>
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<script>
  // ---- Project list ----
  // type: "image" (default), "video" (autoplays in grid, opens with controls),
  //       or "link" (click goes to an external URL instead of the lightbox)
  // thumb: grid image | full: lightbox image (for type "video", both point to the mp4)
  const projects = [
    // ---- Line 1 ----
    { type: "image", thumb: "images/thumbs/tracking-the-buzz-20-years-of-honey-bees.jpg", full: "images/full/tracking-the-buzz-20-years-of-honey-bees.jpg", title: "Tracking the Buzz - 20 Years of Honey Bees" },
    { type: "image", thumb: "images/thumbs/yukon-river-float-eagle-to-circle.jpg", full: "images/full/yukon-river-float-eagle-to-circle.jpg", title: "Yukon River Float, Eagle to Circle" },
    { type: "image", thumb: "images/thumbs/migration-patterns-of-the-eastern-humpback-whale.jpg", full: "images/full/migration-patterns-of-the-eastern-humpback-whale.jpg", title: "Migration Patterns of the Eastern Humpback Whale" },
    { type: "image", thumb: "images/thumbs/craters-of-the-moon.png", full: "images/full/craters-of-the-moon.png", title: "Craters of the Moon" },

    // ---- Line 2 ----
    { type: "link", thumb: "images/thumbs/skyhub-explorer-web-app.png", url: "https://skyhub.alaska.gov/", title: "SkyHub Explorer - Web App" },
    { type: "link", thumb: "images/thumbs/alaska-geoportal-web-app.png", url: "https://akgeoportal.alaska.gov/", title: "Alaska Geoportal - Web App" },
    { type: "image", thumb: "images/full/hurricane-helene-storm-surge-levels-madeira-beach-fl.gif", full: "images/full/hurricane-helene-storm-surge-levels-madeira-beach-fl.gif", title: "Hurricane Helene Storm Surge Levels in Madeira Beach, FL" },
    { type: "video", thumb: "images/full/honey-bee-animation.mp4", full: "images/full/honey-bee-animation.mp4", title: "Honey Bee Animation" },

    // ---- Remaining projects ----
    { type: "image", thumb: "images/thumbs/40-mile-river-ak.jpg", full: "images/full/40-mile-river-ak.jpg", title: "40 Mile River, AK" },
    { type: "image", thumb: "images/thumbs/addressing-in-sand-point-ak.jpg", full: "images/full/addressing-in-sand-point-ak.jpg", title: "Addressing in Sand Point, AK" },
    { type: "image", thumb: "images/thumbs/alaska-coastal-communities.jpg", full: "images/full/alaska-coastal-communities.jpg", title: "Alaska Coastal Communities" },
    { type: "image", thumb: "images/thumbs/alaska-food-policy-council-food-spoilage-dashboard.png", full: "images/full/alaska-food-policy-council-food-spoilage-dashboard.png", title: "Alaska Food Policy Council Food Spoilage Dashboard" },
    { type: "image", thumb: "images/thumbs/anchorage-neighborhoods.png", full: "images/full/anchorage-neighborhoods.png", title: "Anchorage Neighborhoods" },
    { type: "image", thumb: "images/thumbs/aurora-forecast.jpg", full: "images/full/aurora-forecast.jpg", title: "Aurora Forecast" },
    { type: "image", thumb: "images/thumbs/calista-region-ak.jpg", full: "images/full/calista-region-ak.jpg", title: "Calista Region, AK" },
    { type: "image", thumb: "images/thumbs/donut-miss-this.jpg", full: "images/full/donut-miss-this.jpg", title: "Donut Miss This!" },
    { type: "image", thumb: "images/thumbs/front-range-chugach-ak.jpg", full: "images/full/front-range-chugach-ak.jpg", title: "Front Range Chugach, AK" },
    { type: "image", thumb: "images/thumbs/huslia-river-watershed.jpg", full: "images/full/huslia-river-watershed.jpg", title: "Huslia River Watershed" },
    { type: "image", thumb: "images/thumbs/klondike-gold-rush-national-historic-park-ak.jpg", full: "images/full/klondike-gold-rush-national-historic-park-ak.jpg", title: "Klondike Gold Rush National Historic Park, AK" },
    { type: "image", thumb: "images/thumbs/map-projections.jpg", full: "images/full/map-projections.jpg", title: "Map Projections" },
    { type: "image", thumb: "images/thumbs/marsh-island-la.png", full: "images/full/marsh-island-la.png", title: "Marsh Island, LA" },
    { type: "image", thumb: "images/thumbs/mat-su-borough-land-use-change.jpg", full: "images/full/mat-su-borough-land-use-change.jpg", title: "Mat Su Borough Land Use Change" },
    { type: "image", thumb: "images/thumbs/metrolink-subdivisions.jpg", full: "images/full/metrolink-subdivisions.jpg", title: "Metrolink Subdivisions" },
    { type: "image", thumb: "images/thumbs/sheridan-glacier-ak.png", full: "images/full/sheridan-glacier-ak.png", title: "Sheridan Glacier, AK" },
    { type: "image", thumb: "images/thumbs/usda-census-of-ag-dashboard.png", full: "images/full/usda-census-of-ag-dashboard.png", title: "USDA Census of Ag Dashboard" },
    { type: "image", thumb: "images/thumbs/wadi-rum-jordan.png", full: "images/full/wadi-rum-jordan.png", title: "Wadi Rum, Jordan" },
    { type: "image", thumb: "images/thumbs/yukon-rem.jpg", full: "images/full/yukon-rem.jpg", title: "Yukon REM" }
  ];

  const grid = document.getElementById('grid');
  const lightbox = document.getElementById('lightbox');
  const lightboxMedia = document.getElementById('lightbox-media');
  const lightboxCaption = document.getElementById('lightbox-caption');

  projects.forEach(p => {
    const tile = document.createElement('div');
    tile.className = 'tile';

    const mediaTag = p.type === 'video'
      ? `<video src="${p.thumb}" autoplay muted loop playsinline></video>`
      : `<img src="${p.thumb}" alt="${p.title}" loading="lazy">`;

    tile.innerHTML = `
      ${mediaTag}
      <div class="tile-overlay">
        <div class="tile-title">${p.title}</div>
      </div>
    `;

    tile.addEventListener('click', () => {
      if (p.type === 'link') {
        window.open(p.url, '_blank', 'noopener');
        return;
      }
      lightboxMedia.innerHTML = p.type === 'video'
        ? `<video src="${p.full}" controls autoplay loop></video>`
        : `<img src="${p.full}" alt="${p.title}">`;
      lightboxCaption.textContent = p.title;
      lightbox.classList.add('open');
    });

    grid.appendChild(tile);
  });

  function closeLightbox(){
    lightbox.classList.remove('open');
    lightboxMedia.innerHTML = ''; // stops video playback when closed
  }
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
</script>

</body>
</html>
