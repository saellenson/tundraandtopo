<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shira A. Ellenson — Maps &amp; More</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand brand-lg">Shira A. Ellenson</div>
    <div class="nav-links">
      <a href="index.html" class="active">Work</a>
      <span class="nav-sep">|</span>
      <a href="about.html">About</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="grid" id="grid"></div>

  <div class="section-heading">Interactive Web Experiences</div>
  <div class="grid grid-tight" id="grid-apps"></div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="lightbox-close">&times;</span>
  <span class="lightbox-arrow prev" id="lightbox-prev">&#8249;</span>
  <span class="lightbox-arrow next" id="lightbox-next">&#8250;</span>
  <div class="lightbox-award" id="lightbox-award"></div>
  <div class="lightbox-published" id="lightbox-published"></div>
  <div id="lightbox-media"></div>
  <div class="lightbox-lens" id="lightbox-lens"></div>
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<script>
  // Small award-ribbon icon, reused for any project with award: true
  const AWARD_SVG = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2.5L14.7 9.1L21.8 9.6L16.3 14.1L18.1 21L12 17.1L5.9 21L7.7 14.1L2.2 9.6L9.3 9.1Z" fill="#C9A227"/>
  </svg>`;

  const STAR_BLUE_SVG = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2.5L14.7 9.1L21.8 9.6L16.3 14.1L18.1 21L12 17.1L5.9 21L7.7 14.1L2.2 9.6L9.3 9.1Z" fill="#7EC8E3"/>
  </svg>`;

  function escAttr(s){ return s.replace(/&/g, '&amp;'); }

  // ---- Main grid ----
  // type: "image" (default) or "video" (autoplays in grid, opens with controls)
  // award: true adds the "Award Winner" badge on hover
  // rotate: degrees to rotate ONLY in the lightbox view (grid thumbnail stays as-is)
  const projects = [
    // ---- Line 1 ----
    { type: "image", thumb: "images/thumbs/tracking-the-buzz-20-year-of-honey-bees.jpg", full: "images/full/tracking-the-buzz-20-year-of-honey-bees.jpg", title: "Tracking the Buzz - 20 Years of Honey Bees", award: true },
    { type: "image", thumb: "images/thumbs/yukon-river-float-eagle-to-circle.jpg", full: "images/full/yukon-river-float-eagle-to-circle.jpg", title: "Yukon River Float, Eagle to Circle" },
    { type: "image", thumb: "images/thumbs/migration-patterns-of-the-eastern-humpback-whale.jpg", full: "images/full/migration-patterns-of-the-eastern-humpback-whale.jpg", title: "Migration Patterns of the Eastern Humpback Whale" },
    { type: "image", thumb: "images/thumbs/craters-of-the-moon.jpg", full: "images/full/craters-of-the-moon.jpg", title: "Craters of the Moon" },

    // ---- Line 2 ----
    { type: "image", thumb: "images/full/hurricane-helene-storm-surge-levels-in-madeira-beach-fl.gif", full: "images/full/hurricane-helene-storm-surge-levels-in-madeira-beach-fl.gif", title: "Hurricane Helene Storm Surge Levels in Madeira Beach, FL" },
    { type: "image", thumb: "images/thumbs/yukon-rem.jpg", full: "images/full/yukon-rem.jpg", title: "Yukon REM" },
    { type: "image", thumb: "images/thumbs/wadi-rum-jordan.jpg", full: "images/full/wadi-rum-jordan.jpg", title: "Wadi Rum, Jordan", award: true, zoomThumb: "lg" },
    { type: "video", thumb: "images/full/honey-bee-colonies-animation.mp4", full: "images/full/honey-bee-colonies-animation.mp4", title: "Honey Bee Animation" },

    // ---- Remaining projects ----
    { type: "image", thumb: "images/thumbs/addressing-in-sand-point-ak.jpg", full: "images/full/addressing-in-sand-point-ak.jpg", title: "Addressing in Sand Point, AK", award: true },
    { type: "image", thumb: "images/thumbs/jewish-movement-in-the-16th-century.jpg", full: "images/full/jewish-movement-in-the-16th-century.jpg", title: "Jewish Movement in the 16th Century", published: { label: "Map series published in", source: "Sephardic Zionism", url: "https://www.amazon.com/dp/B0HD9HNKJ4?lv=shuf&bestFormat=true&social_share=cm_sw_r_ffobk_cp_ud_dp_FB1Y5F6YR8GA5YP8WTZS&channelId=704&ref_=cm_sw_r_ffobk_cp_ud_dp_FB1Y5F6YR8GA5YP8WTZS&plpRedirect=mhFallback" } },
    { type: "image", thumb: "images/thumbs/front-range-chugach-ak.jpg", full: "images/full/front-range-chugach-ak.jpg", title: "The Chugach Front Range" },
    { type: "image", thumb: "images/thumbs/sheridan-glacier-ak.jpg", full: "images/full/sheridan-glacier-ak.jpg", title: "Sheridan Glacier, AK" },
    { type: "image", thumb: "images/thumbs/anchorage-neighborhoods.jpg", full: "images/full/anchorage-neighborhoods.jpg", title: "Anchorage Neighborhoods" },
    { type: "image", thumb: "images/thumbs/alaska-coastal-communities.jpg", full: "images/full/alaska-coastal-communities.jpg", title: "Alaska Coastal Communities" },
    { type: "image", thumb: "images/thumbs/aurora-forescast.jpg", full: "images/full/aurora-forescast.jpg", title: "Aurora Forecast", published: { label: "Published in", source: "ASPRS Photogrammetric Engineering & Remote Sensing", url: "https://my.asprs.org/Common/Uploaded%20files/PERS/GISTT/GISTT%202024-11.pdf" } },
    { type: "image", thumb: "images/thumbs/donut-miss-this.jpg", full: "images/full/donut-miss-this.jpg", title: "Donut Miss This!" },
    { type: "image", thumb: "images/thumbs/calista-region-ak.jpg", full: "images/full/calista-region-ak.jpg", title: "Calista Region, AK" },
    { type: "image", thumb: "images/thumbs/map-projections.jpg", full: "images/full/map-projections.jpg", title: "Map Projections" },
    { type: "image", thumb: "images/thumbs/klondike-gold-rush-national-historic-park-ak.jpg", full: "images/full/klondike-gold-rush-national-historic-park-ak.jpg", title: "Klondike Gold Rush National Historic Park, AK" },
    { type: "image", thumb: "images/thumbs/40-mile-river-ak.jpg", full: "images/full/40-mile-river-ak.jpg", title: "Fortymile River" },
    { type: "image", thumb: "images/thumbs/mat-su-borough-land-use-change.jpg", full: "images/full/mat-su-borough-land-use-change.jpg", title: "Mat Su Borough Land Use Change" },
    { type: "image", thumb: "images/thumbs/metrolink-subdivisions.jpg", full: "images/full/metrolink-subdivisions.jpg", title: "Metrolink Subdivisions", zoomThumb: true },
    { type: "image", thumb: "images/thumbs/huslia-river-watershed.jpg", full: "images/full/huslia-river-watershed.jpg", title: "Huslia River Watershed" },
    { type: "image", thumb: "images/thumbs/marsh-island-la.jpg", full: "images/full/marsh-island-la.jpg", title: "Marsh Island, LA" }
  ];

  // ---- Interactive Maps & Apps ----
  // type "link" opens the URL in a new tab instead of the lightbox
  const interactiveApps = [
    { type: "link", thumb: "images/full/alaska-geoportal-web-app.jpg", url: "https://akgeoportal.alaska.gov/", title: "Alaska Geoportal | Web App" },
    { type: "link", thumb: "images/full/skyhub-explorer-web-app.jpg", url: "https://skyhub.alaska.gov/", title: "SkyHub Explorer | Web App" },
    { type: "link", thumb: "images/full/how-permafrost-thaw-is-reshaping-alaska-storymap.jpg", url: "https://storymaps.arcgis.com/stories/7440f64b22654dde98961df9153bbe4d", title: "Permafrost Thaw | StoryMap" },
    { type: "link", thumb: "images/full/alaska-food-policy-council-food-spoilage-dashboard.jpg", url: "https://maps.arcgis.com/apps/dashboards/b06e04e6196649ce9ab663a46526cb17", title: "Food Spoilage | Dashboard" }
  ];

  const lightbox = document.getElementById('lightbox');
  const lightboxMedia = document.getElementById('lightbox-media');
  const lightboxCaption = document.getElementById('lightbox-caption');
  const lightboxPrev = document.getElementById('lightbox-prev');
  const lightboxNext = document.getElementById('lightbox-next');
  const lightboxAward = document.getElementById('lightbox-award');
  const lightboxPublished = document.getElementById('lightbox-published');
  const lightboxLens = document.getElementById('lightbox-lens');

  const LENS_SIZE = 220;
  const ZOOM = 2.4;

  // Only the main grid is navigable with arrows — the app links open a new tab instead.
  let currentIndex = -1;
  let currentIsRotated = false;

  function hideLens(){ lightboxLens.style.display = 'none'; }

  function showItem(index) {
    const p = projects[index];
    currentIndex = index;
    currentIsRotated = !!p.rotate;
    hideLens();

    if (p.type === 'video') {
      lightboxMedia.innerHTML = `<video src="${p.full}" controls autoplay loop></video>`;
    } else if (p.rotate) {
      // Compute exact pixel dimensions so the rotated box fits the viewport correctly
      // (CSS max-width/max-height can't account for a transform rotation on its own).
      lightboxMedia.innerHTML = '';
      const img = document.createElement('img');
      img.src = p.full;
      img.alt = p.title;
      img.style.transform = `rotate(${p.rotate}deg)`;
      img.addEventListener('load', () => {
        const nw = img.naturalWidth, nh = img.naturalHeight;
        const maxW = window.innerWidth * 0.82;
        const maxH = window.innerHeight * 0.82;
        // After a 90deg rotation, on-screen width/height swap relative to natural size.
        const scale = Math.min(maxW / nh, maxH / nw);
        img.style.width = (nw * scale) + 'px';
        img.style.height = (nh * scale) + 'px';
      });
      lightboxMedia.appendChild(img);
    } else {
      lightboxMedia.innerHTML = `<img src="${p.full}" alt="${p.title}">`;
    }
    lightboxCaption.textContent = p.title;
    lightboxAward.innerHTML = p.award ? `${AWARD_SVG}<span>Award Winner</span>` : '';
    lightboxPublished.innerHTML = p.published
      ? `${STAR_BLUE_SVG}<span>${p.published.label} <a href="${escAttr(p.published.url)}" target="_blank" rel="noopener"><i>${p.published.source}</i></a></span>`
      : '';
  }

  function openLightbox(index) {
    showItem(index);
    lightbox.classList.add('open');
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    lightboxMedia.innerHTML = ''; // stops video playback when closed
    hideLens();
  }

  function showPrev(){ showItem((currentIndex - 1 + projects.length) % projects.length); }
  function showNext(){ showItem((currentIndex + 1) % projects.length); }

  function renderGrid(items, gridEl, navigable) {
    items.forEach((p, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';

      const zoomClass = p.zoomThumb === 'lg' ? ' zoom-thumb-lg' : (p.zoomThumb ? ' zoom-thumb' : '');
      const mediaTag = p.type === 'video'
        ? `<video src="${p.thumb}" autoplay muted loop playsinline></video>`
        : `<img src="${p.thumb}" alt="${p.title}" loading="lazy" class="${zoomClass}">`;

      const awardTag = p.award
        ? `<div class="tile-award">${AWARD_SVG}<span>Award Winner</span></div>`
        : '';

      const publishedTag = p.published
        ? `<div class="tile-published always-visible">${STAR_BLUE_SVG}<span>${p.published.label} <a href="${escAttr(p.published.url)}" target="_blank" rel="noopener"><i>${p.published.source}</i></a></span></div>`
        : '';

      tile.innerHTML = `
        ${mediaTag}
        <div class="tile-overlay">
          <div class="tile-title">${p.title}</div>
        </div>
        ${awardTag}
        ${publishedTag}
      `;

      if (p.published) {
        tile.querySelector('.tile-published').addEventListener('click', (e) => e.stopPropagation());
      }

      tile.addEventListener('click', () => {
        if (p.type === 'link') {
          window.open(p.url, '_blank', 'noopener');
          return;
        }
        openLightbox(i);
      });

      gridEl.appendChild(tile);
    });
  }

  renderGrid(projects, document.getElementById('grid'), true);
  renderGrid(interactiveApps, document.getElementById('grid-apps'), false);

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  lightboxPrev.addEventListener('click', (e) => { e.stopPropagation(); showPrev(); });
  lightboxNext.addEventListener('click', (e) => { e.stopPropagation(); showNext(); });
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showPrev();
    if (e.key === 'ArrowRight') showNext();
  });

  // Magnifier: hover a full-size (non-rotated) image to see a zoomed lens follow the cursor.
  lightboxMedia.addEventListener('mousemove', (e) => {
    const img = e.target.closest('img');
    if (!img || currentIsRotated) { hideLens(); return; }

    const rect = img.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    if (x < 0 || y < 0 || x > rect.width || y > rect.height) { hideLens(); return; }

    lightboxLens.style.display = 'block';
    lightboxLens.style.left = (e.clientX - LENS_SIZE / 2) + 'px';
    lightboxLens.style.top = (e.clientY - LENS_SIZE / 2) + 'px';
    lightboxLens.style.backgroundImage = `url(${img.src})`;
    lightboxLens.style.backgroundSize = `${rect.width * ZOOM}px ${rect.height * ZOOM}px`;
    lightboxLens.style.backgroundPosition =
      `-${x * ZOOM - LENS_SIZE / 2}px -${y * ZOOM - LENS_SIZE / 2}px`;
  });
  lightboxMedia.addEventListener('mouseleave', hideLens);
</script>

</body>
</html>
